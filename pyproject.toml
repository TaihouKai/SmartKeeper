[project]
name = "smartkeeper"
version = "0.1.0"
description = "An asynchronous text TRPG engine with an LLM as the keeper."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pyright>=1.1.390",
    "ruff>=0.7",
    "import-linter>=2.1",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartkeeper"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "docs", "smartkeeper/web/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF003"]  # 行长交给 formatter；中文标点是有意的

[tool.pyright]
include = ["smartkeeper", "tests", "scripts"]
exclude = ["frontend", "**/node_modules", ".venv"]
typeCheckingMode = "standard"
strict = ["smartkeeper", "scripts"]  # 产品代码严格；测试用标准模式
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: needs a real model or network; not run by default",
]
